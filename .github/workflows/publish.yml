name: 构建并发布到 npm

# 自动触发：推送 v* tag（如 v0.5.11）即自动构建并发布到 npm 官方仓库
# （registry.npmjs.org）。日常提交不带 tag，不会触发发布。
# 手动触发：可在 Actions 页面选分支跑一次演练（dry_run 默认开）。
#
# 本工作流不产出任何产物：不保留 artifact、不创建 GitHub Release、
# 不把打包结果推回 GitHub 仓库，构建结果只流向 npm。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '发布前演练（npm publish --dry-run，不会真正上传）'
        type: boolean
        default: true
      provenance:
        description: '启用 npm provenance 签名（需仓库为公开仓库）'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance / OIDC 受信任发布需要

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: 构建并发布到 npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/dsh-event-notice
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: 固定 npm 官方仓库
        run: |
          set -euo pipefail
          # 显式指向 npm 官方仓库，避免继承宿主 .npmrc 里的镜像源
          npm config set registry https://registry.npmjs.org
          npm config get registry

      - name: 安装依赖
        run: |
          set -euo pipefail
          npm ci

      - name: 语法检查
        run: |
          set -euo pipefail
          for f in index.js client.js lib/*.js test/*.js; do
            node --check "$f"
            echo "ok: $f"
          done

      - name: 运行单元测试
        run: npm test

      - name: 校验包信息
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json');
            if (p.private) { console.error('package.json 仍为 private:true，无法发布'); process.exit(1); }
            if (!p.version) { console.error('缺少 version'); process.exit(1); }
            if (p.name !== 'dsh-event-notice') { console.error('包名应为 dsh-event-notice，实际为', p.name); process.exit(1); }
            if (p.license !== 'MIT') { console.error('license 应为 MIT，实际为', p.license); process.exit(1); }
            console.log('包名:', p.name, '版本:', p.version, '协议:', p.license);"
          if [ ! -f LICENSE ]; then
            echo "::error::仓库根目录缺少 LICENSE 文件"
            exit 1
          fi

      - name: 校验 tag 与版本号一致
        # 仅 tag 触发时校验：tag 形如 v0.5.11，package.json 的 version 应为 0.5.11
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 版本 ${PKG_VERSION} 不一致，拒绝发布"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} 与 package.json 版本 ${PKG_VERSION} 一致"

      - name: 检查版本是否已发布
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-event-notice@${VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::error::版本 ${VERSION} 已发布过，请先提升 package.json 版本号"
            exit 1
          fi
          echo "版本 ${VERSION} 尚未发布，可以继续"

      - name: 预览打包内容
        # 只打印文件清单，不落地 tarball，也不保留任何产物
        run: npm pack --dry-run --registry=https://registry.npmjs.org

      - name: 确定认证方式
        id: auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "使用仓库 Secret 中的 NPM_TOKEN 认证"
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "未配置 NPM_TOKEN，改用 OIDC 受信任发布（需在 npmjs.com 为本仓库开启 Trusted Publishing）"
            # setup-node 写入的 .npmrc 带一行 _authToken=${NODE_AUTH_TOKEN}，
            # token 为空时会变成空 token 行，反而盖掉 OIDC 认证，这里重写成只有 registry。
            printf 'registry=https://registry.npmjs.org/\n' > ~/.npmrc
          fi

      - name: 发布到 npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          PROVENANCE: ${{ inputs.provenance }}
          MODE: ${{ steps.auth.outputs.mode }}
        run: |
          set -euo pipefail
          REGISTRY="https://registry.npmjs.org"
          ARGS=(--access public --registry "${REGISTRY}")
          if [ "${MODE}" = "oidc" ]; then
            # OIDC 受信任发布需要 npm >= 11.5.1
            npm install -g npm@latest
            npm --version
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            # 演练模式不带 --provenance：演练不真正上传，也就不需要签名
            npm publish --dry-run "${ARGS[@]}"
            echo "::notice::dry_run=true：本次只做发布演练，未真正上传到 npm"
            exit 0
          fi
          if [ "${PROVENANCE}" != "false" ]; then
            # tag 触发时没有输入项（PROVENANCE 为空），同样默认开启 provenance 签名
            npm publish "${ARGS[@]}" --provenance
          else
            npm publish "${ARGS[@]}"
          fi

      - name: 校验发布结果
        # dry_run 时并未真正发布到 npm，回查 registry 必然 404，跳过本步
        if: ${{ inputs.dry_run != true }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          # npm registry 存在传播延迟（新版本通常几十秒~几分钟才可被回查查到），
          # 之前只重试 5 次 × 5 秒会在发布其实已成功的情况下误报失败。
          # 显式指定 registry，避免继承宿主 .npmrc 指向的镜像源而查不到新版本。
          MAX_RETRY=20
          for i in $(seq 1 $MAX_RETRY); do
            if npm view "dsh-event-notice@${VERSION}" version dist.tarball \
                 --registry=https://registry.npmjs.org; then
              echo "::notice::版本 ${VERSION} 已在 npm registry 上确认发布成功"
              exit 0
            fi
            echo "::notice::第 ${i}/${MAX_RETRY} 次回查未查到版本 ${VERSION}，15 秒后重试"
            sleep 15
          done
          echo "::error::发布后在 npm registry 上未查到版本 ${VERSION}（发布可能仍已成功，请到 npmjs.com 手动确认）"
          exit 1
