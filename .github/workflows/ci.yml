name: CI

# 每次推送与 PR 都跑一遍：语法检查 + 单元测试。
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 语法检查与单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: |
          set -euo pipefail
          npm ci

      - name: 语法检查
        run: |
          set -euo pipefail
          for f in index.js client.js lib/*.js test/*.js; do
            node --check "$f"
            echo "ok: $f"
          done

      - name: 运行单元测试
        run: npm test
